<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文複習樂園</title>
<style>
  :root{
    --bg:#f3f7ff; --card:#ffffff; --ink:#1f2a44; --muted:#5b6b86;
    --blue:#2f6df6; --blue-d:#1f4fd0; --green:#15a46a; --green-bg:#e4f7ee;
    --red:#e0455a; --red-bg:#fdeaee; --gold:#f6b400; --purple:#7a5cff;
    --line:#e3e9f5; --shadow:0 8px 28px rgba(31,42,68,.10);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Microsoft JhengHei","PingFang TC","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(160deg,#eaf1ff 0%,#f6f9ff 40%,#fff6ea 100%);
    color:var(--ink); min-height:100vh; line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:780px;margin:0 auto;padding:16px 16px 60px}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 4px 2px}
  .logo{font-size:26px}
  .brand{font-weight:800;font-size:20px;letter-spacing:.5px}
  .brand small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:0}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px;border:1px solid var(--line)}
  h1{font-size:26px;margin:.2em 0 .1em}
  h2{font-size:20px;margin:.4em 0}
  p.lead{color:var(--muted);margin:.2em 0 1em}
  .hero{background:linear-gradient(135deg,#2f6df6,#7a5cff);color:#fff;border:none}
  .hero h1{color:#fff;font-size:28px}
  .hero p{color:#eaf0ff;margin:.3em 0 0}
  .chip{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
    color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;margin:2px 4px 2px 0}
  .section-title{font-weight:800;font-size:15px;color:var(--muted);margin:18px 2px 6px;letter-spacing:.5px}
  .papers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.papers{grid-template-columns:1fr}}
  .paper{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);
    border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:.15s;width:100%;font:inherit;color:inherit}
  .paper:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:var(--shadow)}
  .paper .pz{font-size:30px;line-height:1}
  .paper b{display:block;font-size:17px}
  .paper span{font-size:13px;color:var(--muted)}
  .paper.random{background:linear-gradient(135deg,#fff3da,#ffe9c7);border-color:#f3d089}
  .paper.weak{background:linear-gradient(135deg,#fde7ec,#ffeef2);border-color:#f3b6c3}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;border:none;
    border-radius:14px;padding:13px 20px;font-size:17px;font-weight:800;cursor:pointer;transition:.15s;font-family:inherit}
  .btn:hover{background:var(--blue-d)}
  .btn.ghost{background:#eef3ff;color:var(--blue-d)}
  .btn.ghost:hover{background:#dde8ff}
  .btn.big{width:100%;padding:16px;font-size:19px}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .seg{display:inline-flex;background:#eef3ff;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
  .seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted);font-family:inherit;font-size:15px}
  .seg button.on{background:#fff;color:var(--blue-d);box-shadow:0 2px 8px rgba(47,109,246,.18)}

  /* quiz */
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .progress{flex:1;height:12px;background:#e7eefc;border-radius:999px;overflow:hidden;min-width:140px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#2f6df6,#7a5cff);border-radius:999px;transition:width .3s}
  .meta{font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
  .badge{display:inline-block;background:#eef3ff;color:var(--blue-d);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;margin-bottom:10px}
  .badge.weak{background:#fde7ec;color:#c23353}
  .qtext{font-size:22px;font-weight:700;margin:6px 0 4px}
  .qhint{color:var(--muted);font-size:15px;margin:0 0 8px}
  .answers{display:flex;flex-direction:column;gap:10px;margin-top:10px}
  .ans{display:flex;align-items:center;gap:10px;text-align:left;background:#f7f9ff;border:2px solid var(--line);
    border-radius:14px;padding:14px 16px;font-size:18px;cursor:pointer;transition:.12s;font-family:inherit;color:inherit;width:100%}
  .ans:hover{border-color:var(--blue)}
  .ans .k{width:26px;height:26px;border-radius:50%;background:#e7eefc;color:var(--blue-d);
    display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .ans.correct{background:var(--green-bg);border-color:var(--green)}
  .ans.correct .k{background:var(--green);color:#fff}
  .ans.wrong{background:var(--red-bg);border-color:var(--red)}
  .ans.wrong .k{background:var(--red);color:#fff}
  .ans.dim{opacity:.55}
  .ans:disabled{cursor:default}
  .fillrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  input.fill{flex:1;min-width:180px;font-size:20px;padding:13px 16px;border:2px solid var(--line);border-radius:14px;font-family:inherit;outline:none}
  input.fill:focus{border-color:var(--blue)}
  input.fill.correct{border-color:var(--green);background:var(--green-bg)}
  input.fill.wrong{border-color:var(--red);background:var(--red-bg)}
  /* order */
  .tiles,.slot{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;margin-top:10px}
  .slot{background:#f3f7ff;border:2px dashed var(--line);border-radius:14px;padding:10px;align-content:flex-start}
  .tile{background:#fff;border:2px solid var(--line);border-radius:10px;padding:9px 13px;font-size:17px;cursor:pointer;font-family:inherit;color:inherit}
  .tile:hover{border-color:var(--blue)}
  .tile.used{opacity:.3;pointer-events:none}
  .feedback{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:16px;display:none}
  .feedback.show{display:block}
  .feedback.ok{background:var(--green-bg);border:1px solid #bfe9d3}
  .feedback.no{background:var(--red-bg);border:1px solid #f6c6d0}
  .feedback .ttl{font-weight:800;font-size:17px;margin-bottom:2px}
  .feedback .corr{font-weight:800;color:var(--green)}
  .feedback .exp{color:var(--ink);margin-top:4px}
  .qfoot{margin-top:16px;display:flex;justify-content:flex-end;gap:10px}
  /* result */
  .score-big{font-size:58px;font-weight:900;line-height:1;text-align:center;margin:6px 0}
  .score-sub{text-align:center;color:var(--muted);font-weight:700;margin-bottom:10px}
  .bk{margin-top:10px}
  .bk .brow{display:flex;align-items:center;gap:10px;margin:8px 0}
  .bk .bname{width:140px;font-weight:700;font-size:14px;flex-shrink:0}
  .bk .btrack{flex:1;height:14px;background:#eef3fc;border-radius:999px;overflow:hidden}
  .bk .bfill{height:100%;border-radius:999px}
  .bk .bpct{width:56px;text-align:right;font-weight:800;font-size:14px}
  .wronglist{margin-top:14px}
  .wrongitem{background:#fff7f8;border:1px solid #f3d0d8;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px}
  .wrongitem .wq{font-weight:700}
  .wrongitem .wa{color:var(--green);font-weight:800}
  .encourage{text-align:center;font-size:20px;font-weight:800;margin:4px 0}
  .footnote{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
  .kbd{font-family:ui-monospace,Consolas,monospace;background:#eef3fc;border-radius:6px;padding:1px 6px;font-size:13px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="logo">🦸‍♂️</span>
    <div class="brand">英文複習樂園<small>ESL 2 · 自然發音 + 文法 + 字彙 · 考前複習</small></div>
  </div>

  <!-- ===== START ===== -->
  <div id="start">
    <div class="card hero">
      <h1>準備好了嗎？開始複習吧！🚀</h1>
      <p>每次打開都有<b>不同的題目</b>，答完一題馬上告訴你正確答案！</p>
      <div style="margin-top:10px">
        <span class="chip">受格・反身代名詞</span>
        <span class="chip">主詞動詞一致 ⭐</span>
        <span class="chip">There is / are</span>
        <span class="chip">自然發音</span>
        <span class="chip">字彙・詞性</span>
        <span class="chip">句子重組</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">① 選一份考卷（每份每次都會洗牌，不會一樣）</div>
      <div class="papers" id="papers"></div>

      <div class="section-title" style="margin-top:20px">② 題目數量</div>
      <div class="seg" id="countSeg">
        <button data-n="20">20 題</button>
        <button data-n="35">35 題</button>
        <button data-n="50" class="on">50 題</button>
      </div>

      <div style="margin-top:20px">
        <button class="btn big" id="startBtn">開始複習 ✏️</button>
      </div>
      <p class="qhint" id="startHint" style="margin-top:12px">目前選擇：<b id="selName">A 卷 · 綜合大複習</b></p>
    </div>

    <p class="footnote">ESL 2 考前英文複習工具 · 題型參考歷次 ESL 2 考卷 · 離線可用，不需網路</p>
  </div>

  <!-- ===== QUIZ ===== -->
  <div id="quiz" class="hide">
    <div class="card">
      <div class="qhead">
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="meta"><span id="qnum">1</span>/<span id="qtot">50</span> · ⭐<span id="score">0</span></div>
      </div>
      <div style="margin-top:16px">
        <span class="badge" id="catBadge">文法</span>
        <div class="qtext" id="qtext"></div>
        <div class="qhint" id="qhint"></div>
      </div>
      <div id="answerArea"></div>
      <div class="feedback" id="feedback"></div>
      <div class="qfoot">
        <button class="btn ghost hide" id="checkBtn">送出答案</button>
        <button class="btn hide" id="nextBtn">下一題 →</button>
      </div>
    </div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn ghost" id="quitBtn">結束並看成績</button>
    </div>
  </div>

  <!-- ===== RESULT ===== -->
  <div id="result" class="hide">
    <div class="card">
      <div class="encourage" id="encourage"></div>
      <div class="score-big" id="finalScore">0%</div>
      <div class="score-sub" id="finalSub">答對 0 / 0 題</div>
      <div class="bk" id="breakdown"></div>
    </div>
    <div class="card" id="reviewCard">
      <h2>📒 要再複習的題目</h2>
      <div class="wronglist" id="wronglist"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn big" id="againBtn">再做一份新的（題目會不同）🔁</button>
    </div>
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn ghost" id="homeBtn">回首頁選別卷</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   題庫  —  題型全部參考 ESL 2 歷次考卷
   每題答案皆以英文文法邏輯逐題驗證，非照抄考卷
   type: 'mc'(選擇) | 'fill'(填空,accept陣列) | 'order'(句子重組)
   cat:  分類（也用來做成績分析與加權）
   ========================================================= */
const CAT = {
  objpron:   "受格代名詞",
  subjobj:   "主格/受格",
  reflex:    "反身代名詞",
  verbform:  "動詞變化(第三人稱)",
  agree:     "主詞動詞一致 ⭐",
  thereis:   "There is / are",
  phonics:   "自然發音",
  hardsoft:  "軟硬音 c / g",
  blend:     "混合音拼讀",
  minpair:   "聽音選字",
  vocab:     "字彙",
  pos:       "詞性",
  order:     "句子重組"
};
const WEAK = ["agree","verbform","pos"]; // 弱項，加權出題

const BANK = [
/* ---------- 受格代名詞 objpron ---------- */
{type:'mc',cat:'objpron',q:'My baby brother is so cute. I play with ___ every day.',opts:['he','him','his'],a:'him',exp:'介系詞 with 後面要用受格；指「弟弟（男生）」用 him。'},
{type:'mc',cat:'objpron',q:'Kate and Jilly are my friends. I like ___ .',opts:['they','them','their'],a:'them',exp:'動詞 like 後面用受格；指兩個人用 them。'},
{type:'mc',cat:'objpron',q:'Who is that woman? Why are you looking at ___ ?',opts:['she','her','hers'],a:'her',exp:'at 後面用受格；指 woman（女生）用 her。'},
{type:'mc',cat:'objpron',q:'We are going to the playground. Do you want to come with ___ ?',opts:['we','us','our'],a:'us',exp:'with 後面用受格；指「我們」用 us。'},
{type:'mc',cat:'objpron',q:'David has a new book. He bought ___ last week.',opts:['it','its','them'],a:'it',exp:'一本書是單數物品，受格用 it。'},
{type:'mc',cat:'objpron',q:'Ben is a good boy. Miss Lin gave ___ a sticker.',opts:['he','him','his'],a:'him',exp:'gave 的受詞用受格；Ben 是男生用 him。'},
{type:'fill',cat:'objpron',q:"I'm thirsty. Give ___ some water, please.",accept:['me'],exp:'give 後面「給我」用受格 me。'},
{type:'mc',cat:'objpron',q:'Mrs. Doris has two daughters. I like ___ very much.',opts:['her','them','it'],a:'them',exp:'two daughters 是複數，受格用 them。'},
{type:'mc',cat:'objpron',q:'The children found a lost puppy and took ___ to the animal shelter.',opts:['it','itself','them'],a:'it',exp:'puppy 是一隻動物（物/單數），受格用 it。'},
{type:'mc',cat:'objpron',q:'Our coach gave ___ some useful advice before the game.',opts:['we','us','our'],a:'us',exp:'gave 的受詞「給我們」用 us。'},
{type:'mc',cat:'objpron',q:'I put some eggs in the basket. Careful! Don’t break ___ .',opts:['it','them','they'],a:'them',exp:'eggs 是複數，受格用 them。'},
{type:'mc',cat:'objpron',q:'The librarian saw Mia talking loudly and asked ___ to be quiet.',opts:['she','her','hers'],a:'her',exp:'asked 的受詞 Mia（女生）用 her。'},
{type:'mc',cat:'objpron',q:'Paul talks to his parrot every day. He takes care of ___ .',opts:['it','him','them'],a:'it',exp:'一隻鸚鵡是單數動物，受格用 it。'},
{type:'fill',cat:'objpron',q:'Because Mr. Ken is a good teacher, we give ___ a Christmas gift.',accept:['him'],exp:'Mr. Ken 是男老師，give 的受詞用 him。'},
{type:'mc',cat:'objpron',q:'Can I go to the bookstore with ___ ? (= you and your friends)',opts:['they','you','them'],a:'you',exp:'「你和你的朋友們」對話中直接對「你們」說話，用 you。'},

/* ---------- 主格/受格 subjobj ---------- */
{type:'mc',cat:'subjobj',q:'Emma is my sister. ___ often helps me with my homework.',opts:['She','Her','Hers'],a:'She',exp:'空格是句子的「主詞」，用主格 She。'},
{type:'mc',cat:'subjobj',q:'My dog is very hungry. ___ is waiting for me to give it food.',opts:['It','Its','Him'],a:'It',exp:'主詞是「一隻狗（動物）」，主格用 It。'},
{type:'mc',cat:'subjobj',q:'Tom and Jack are my friends. ___ often play with me after school.',opts:['They','Them','Their'],a:'They',exp:'主詞是兩個人，主格用 They。'},
{type:'mc',cat:'subjobj',q:'Lily is my classmate. She sits next to me, and I often talk to ___ .',opts:['she','her','hers'],a:'her',exp:'talk to 後面是受格；Lily（女生）用 her。'},
{type:'mc',cat:'subjobj',q:'They are my classmates. They are helping ___ with my homework.',opts:['I','me','my'],a:'me',exp:'helping 的受詞「幫我」用受格 me。'},
{type:'mc',cat:'subjobj',q:'My sister likes dogs. ___ walks them in the park every day.',opts:['She','Her','They'],a:'She',exp:'主詞是「我姊姊」，主格用 She。'},
{type:'mc',cat:'subjobj',q:'Mom gave ( I / me / my ) a new backpack for my birthday.',opts:['I','me','my'],a:'me',exp:'gave 的受詞「給我」用受格 me。'},
{type:'mc',cat:'subjobj',q:'The police are looking for the robbers, but they can’t find ( you / us / them ).',opts:['you','us','them'],a:'them',exp:'find 的受詞是 the robbers（他們），用 them。'},
{type:'mc',cat:'subjobj',q:'Dad is cooking dinner for ( we / us / our ) tonight.',opts:['we','us','our'],a:'us',exp:'for 後面用受格 us。'},
{type:'mc',cat:'subjobj',q:'Who is that cute girl? Do you know ( her / she / him )?',opts:['her','she','him'],a:'her',exp:'know 的受詞是女生，用 her。'},
{type:'mc',cat:'subjobj',q:'Azure is singing with Lily and Julian. She likes ( they / them / him ) a lot.',opts:['they','them','him'],a:'them',exp:'likes 的受詞是兩個人，用 them。'},
{type:'mc',cat:'subjobj',q:'Louis has a new bicycle. ___ rides it to school every day.',opts:['He','Him','His'],a:'He',exp:'主詞「他」用主格 He；it 指腳踏車。'},

/* ---------- 反身代名詞 reflex ---------- */
{type:'mc',cat:'reflex',q:'I hurt ___ when I fell off the swing.',opts:['myself','me','mineself'],a:'myself',exp:'主詞 I 對自己做動作，反身用 myself。'},
{type:'mc',cat:'reflex',q:'Lisa looks at ___ in the mirror.',opts:['herself','himself','itself'],a:'herself',exp:'Lisa 是女生，反身用 herself。'},
{type:'mc',cat:'reflex',q:'We learned how to play the piano ___ .',opts:['ourselves','yourselves','themselves'],a:'ourselves',exp:'主詞 We，反身用 ourselves。'},
{type:'mc',cat:'reflex',q:'The children decorate the Christmas tree ___ .',opts:['itself','themselves','himself'],a:'themselves',exp:'the children 是複數，反身用 themselves。'},
{type:'mc',cat:'reflex',q:'The lion can hunt for food ___ .',opts:['itself','himself','themselves'],a:'itself',exp:'the lion 是一隻動物（單數），反身用 itself。'},
{type:'mc',cat:'reflex',q:'"Kids, did you draw the pictures ___ ?"',opts:['yourself','yourselves','themselves'],a:'yourselves',exp:'對很多小孩（you 複數）說話，反身用 yourselves。'},
{type:'mc',cat:'reflex',q:'My brother washes the dishes ___ .',opts:['himself','herself','itself'],a:'himself',exp:'my brother 是男生，反身用 himself。'},
{type:'mc',cat:'reflex',q:'Sam and I enjoyed ___ at the zoo.',opts:['ourselves','themselves','yourselves'],a:'ourselves',exp:'Sam and I = we，反身用 ourselves。'},
{type:'fill',cat:'reflex',q:'I introduce ___ to the new classmate.',accept:['myself'],exp:'主詞 I，反身用 myself。'},
{type:'mc',cat:'reflex',q:'The dog saw its own shadow and chased ___ .',opts:['itself','himself','themselves'],a:'itself',exp:'一隻狗（單數動物）追自己，用 itself。'},
{type:'mc',cat:'reflex',q:'"Ben, did you fix the bike by ___ ?"',opts:['yourself','yourselves','himself'],a:'yourself',exp:'對一個人（Ben）說話，反身用 yourself。'},
{type:'mc',cat:'reflex',q:'My parents taught ___ how to use the new computer.',opts:['themselves','himself','ourselves'],a:'themselves',exp:'my parents 複數，反身用 themselves。'},
{type:'mc',cat:'reflex',q:'My parents live in the mountains by ___ .',opts:['themselves','himself','itself'],a:'themselves',exp:'my parents 複數，反身用 themselves。'},
{type:'mc',cat:'reflex',q:'All of you can do it by ___ .',opts:['yourself','yourselves','ourselves'],a:'yourselves',exp:'all of you 是「你們」複數，用 yourselves。'},
{type:'fill',cat:'reflex',q:'Grandma knits ___ a warm hat. (she)',accept:['herself'],exp:'Grandma 是女生，反身用 herself。'},
/* 反身：找出並改正錯誤（改寫成「選出正確的字」） */
{type:'mc',cat:'reflex',q:'改錯：My students clean the classroom yourself. → 正確的反身代名詞是?',opts:['themselves','yourself','ourselves'],a:'themselves',exp:'主詞 my students 複數且非 you，用 themselves。'},
{type:'mc',cat:'reflex',q:'改錯：My brother lives by herself in Japan. → 正確的反身代名詞是?',opts:['himself','herself','itself'],a:'himself',exp:'my brother 是男生，用 himself。'},
{type:'mc',cat:'reflex',q:'改錯：Grandpa sewed his pants by itself. → 正確的反身代名詞是?',opts:['himself','itself','themselves'],a:'himself',exp:'Grandpa 是男生（人），用 himself，不用 itself。'},
{type:'mc',cat:'reflex',q:'改錯：My sister and I prepare dinner herself. → 正確的反身代名詞是?',opts:['ourselves','herself','themselves'],a:'ourselves',exp:'My sister and I = we，用 ourselves。'},

/* ================= 狀態 ================= */
let state=null;
let selectedPaper='A';
let selectedCount=50;

/* ----- 工具 ----- */
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function byCat(c){return BANK.filter(q=>q.cat===c);}
function norm(s){return (s||'').toString().toLowerCase().trim().replace(/[.．。!?]+$/,'').replace(/\s+/g,' ');}

/* 依卷別組題：依權重抽，抽完洗牌，補到指定題數 */
function buildQuiz(paperKey,count){
  const p=PAPERS[paperKey];
  let picked=[];
  if(p.random){
    picked=shuffle(BANK).slice(0,count);
  }else{
    const pools={};Object.keys(p.weights).forEach(c=>pools[c]=shuffle(byCat(c)));
    const w=p.weights;const cats=Object.keys(w);
    const totalW=cats.reduce((s,c)=>s+w[c],0);
    // 依比例分配題數
    let plan={};let assigned=0;
    cats.forEach(c=>{plan[c]=Math.round(count*w[c]/totalW);assigned+=plan[c];});
    // 抽題（不夠就用該卷其他類別補）
    cats.forEach(c=>{for(let i=0;i<plan[c]&&pools[c].length;i++)picked.push(pools[c].pop());});
    // 補足
    let leftover=shuffle(cats.flatMap(c=>pools[c]));
    while(picked.length<count && leftover.length)picked.push(leftover.pop());
    // 若該卷題庫太小，從全題庫補
    if(picked.length<count){
      const extra=shuffle(BANK.filter(q=>!picked.includes(q)));
      while(picked.length<count && extra.length)picked.push(extra.pop());
    }
  }
  picked=shuffle(picked).slice(0,count);
  // 每題的選項也洗牌
  return picked.map(q=>{
    const item=Object.assign({},q);
    if(item.opts)item.opts=shuffle(item.opts);
    if(item.tokens)item.tokens=shuffle(item.tokens);
    return item;
  });
}

/* ================= 首頁 ================= */
function renderPapers(){
  const box=document.getElementById('papers');box.innerHTML='';
  Object.keys(PAPERS).forEach(k=>{
    const p=PAPERS[k];
    const b=document.createElement('button');
    b.className='paper'+(k==='R'?' random':'')+(k==='E'?' weak':'');
    b.innerHTML=`<span class="pz">${p.icon}</span><span><b>${p.name}</b><span>${p.desc}</span></span>`;
    b.onclick=()=>{selectedPaper=k;markSel();};
    b.dataset.k=k;
    box.appendChild(b);
  });
  markSel();
}
function markSel(){
  document.querySelectorAll('.paper').forEach(el=>{
    el.style.borderColor = el.dataset.k===selectedPaper ? 'var(--blue)' : '';
    el.style.boxShadow = el.dataset.k===selectedPaper ? 'var(--shadow)' : '';
  });
  document.getElementById('selName').textContent=PAPERS[selectedPaper].name;
}
document.getElementById('countSeg').addEventListener('click',e=>{
  if(e.target.dataset.n){selectedCount=+e.target.dataset.n;
    document.querySelectorAll('#countSeg button').forEach(b=>b.classList.toggle('on',b===e.target));}
});
document.getElementById('startBtn').onclick=startQuiz;

/* ================= 開始測驗 ================= */
function startQuiz(){
  const qs=buildQuiz(selectedPaper,selectedCount);
  state={qs,idx:0,score:0,answered:0,wrong:[],perCat:{}};
  document.getElementById('start').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  document.getElementById('quiz').classList.remove('hide');
  document.getElementById('qtot').textContent=qs.length;
  renderQ();
  window.scrollTo(0,0);
}

function catName(c){return CAT[c]||c;}
function isWeak(c){return WEAK.includes(c);}

function renderQ(){
  const q=state.qs[state.idx];
  document.getElementById('qnum').textContent=state.idx+1;
  document.getElementById('score').textContent=state.score;
  document.getElementById('bar').style.width=((state.idx)/state.qs.length*100)+'%';
  const badge=document.getElementById('catBadge');
  badge.textContent=catName(q.cat);
  badge.className='badge'+(isWeak(q.cat)?' weak':'');
  document.getElementById('qtext').textContent=q.q;
  document.getElementById('qhint').textContent = q.type==='fill' ? '✍️ 請打字作答（英文）' : (q.type==='order'?'👆 點字卡排出正確順序':'👆 點一個答案');
  const fb=document.getElementById('feedback');fb.className='feedback';fb.innerHTML='';
  document.getElementById('nextBtn').classList.add('hide');
  const checkBtn=document.getElementById('checkBtn');
  const area=document.getElementById('answerArea');area.innerHTML='';

  if(q.type==='mc'){
    checkBtn.classList.add('hide');
    const wrap=document.createElement('div');wrap.className='answers';
    q.opts.forEach((opt,i)=>{
      const b=document.createElement('button');b.className='ans';
      b.innerHTML=`<span class="k">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
      b.onclick=()=>pickMC(b,opt,q);
      wrap.appendChild(b);
    });
    area.appendChild(wrap);
  }else if(q.type==='fill'){
    checkBtn.classList.remove('hide');
    const row=document.createElement('div');row.className='fillrow';
    const inp=document.createElement('input');inp.className='fill';inp.id='fillInput';
    inp.placeholder='在這裡打答案…';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkFill(q);});
    row.appendChild(inp);area.appendChild(row);
    setTimeout(()=>inp.focus(),50);
    checkBtn.onclick=()=>checkFill(q);
  }else if(q.type==='order'){
    checkBtn.classList.remove('hide');
    checkBtn.textContent='送出答案';
    const slot=document.createElement('div');slot.className='slot';slot.id='slot';
    const tiles=document.createElement('div');tiles.className='tiles';tiles.id='tiles';
    q.tokens.forEach((t,i)=>{
      const b=document.createElement('button');b.className='tile';b.textContent=t;b.dataset.i=i;
      b.onclick=()=>{moveToSlot(b);};
      tiles.appendChild(b);
    });
    const lbl=document.createElement('div');lbl.className='qhint';lbl.textContent='你排的句子：';
    area.appendChild(lbl);area.appendChild(slot);
    const lbl2=document.createElement('div');lbl2.className='qhint';lbl2.style.marginTop='10px';lbl2.textContent='字卡（點選加入）：';
    area.appendChild(lbl2);area.appendChild(tiles);
    state._order=[];
    checkBtn.onclick=()=>checkOrder(q);
  }
}

function moveToSlot(btn){
  const slot=document.getElementById('slot');
  const t=document.createElement('button');t.className='tile';t.textContent=btn.textContent;
  t.onclick=()=>{t.remove();btn.classList.remove('used');syncOrder();};
  slot.appendChild(t);btn.classList.add('used');syncOrder();
}
function syncOrder(){
  state._order=[...document.querySelectorAll('#slot .tile')].map(t=>t.textContent);
}

function pickMC(btn,opt,q){
  const correct = opt===q.a;
  document.querySelectorAll('#answerArea .ans').forEach(b=>{
    b.disabled=true;
    const txt=b.querySelector('span:last-child').textContent;
    if(txt===q.a)b.classList.add('correct');
    else if(b===btn)b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finishQ(correct,q,q.a);
}

function checkFill(q){
  const inp=document.getElementById('fillInput');if(!inp)return;
  if(!inp.value.trim()){inp.focus();return;}
  const ok=q.accept.map(norm).includes(norm(inp.value));
  inp.disabled=true;inp.classList.add(ok?'correct':'wrong');
  document.getElementById('checkBtn').classList.add('hide');
  finishQ(ok,q,q.accept[0]);
}

function checkOrder(q){
  syncOrder();
  if(state._order.length!==q.a.length){
    const fb=document.getElementById('feedback');fb.className='feedback no show';
    fb.innerHTML='<div class="ttl">還沒排完喔！</div><div class="exp">請把所有字卡都用上。</div>';
    return;
  }
  const ok=norm(state._order.join(' '))===norm(q.a.join(' '));
  document.querySelectorAll('#tiles .tile').forEach(b=>b.disabled=true);
  document.getElementById('checkBtn').classList.add('hide');
  finishQ(ok,q,q.a.join(' '));
}

function finishQ(ok,q,correctText){
  state.answered++;
  if(!state.perCat[q.cat])state.perCat[q.cat]={right:0,total:0};
  state.perCat[q.cat].total++;
  if(ok){state.score++;state.perCat[q.cat].right++;}
  else{state.wrong.push({q:q.q,a:correctText,exp:q.exp,cat:q.cat});}
  document.getElementById('score').textContent=state.score;
  const fb=document.getElementById('feedback');
  fb.className='feedback show '+(ok?'ok':'no');
  const praise=['太棒了！','答對了！','很厲害！','就是這個！','你好強！'];
  if(ok){
    fb.innerHTML=`<div class="ttl">✅ ${praise[Math.floor(Math.random()*praise.length)]}</div>`+
      (q.exp?`<div class="exp">💡 ${q.exp}</div>`:'');
  }else{
    fb.innerHTML=`<div class="ttl">❌ 再看一次～</div>`+
      `<div>正確答案是：<span class="corr">${correctText}</span></div>`+
      (q.exp?`<div class="exp">💡 ${q.exp}</div>`:'');
  }
  const next=document.getElementById('nextBtn');
  next.classList.remove('hide');
  next.textContent = state.idx+1>=state.qs.length ? '看成績 🎉' : '下一題 →';
  next.focus();
}

document.getElementById('nextBtn').onclick=()=>{
  if(state.idx+1>=state.qs.length){showResult();}
  else{state.idx++;renderQ();window.scrollTo({top:0,behavior:'smooth'});}
};
document.getElementById('quitBtn').onclick=()=>{if(state.answered===0){goHome();}else showResult();};

/* ================= 成績 ================= */
function showResult(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.remove('hide');
  const total=state.answered;const right=state.score;
  const pct=total?Math.round(right/total*100):0;
  document.getElementById('finalScore').textContent=pct+'%';
  document.getElementById('finalSub').textContent=`答對 ${right} / ${total} 題`;
  const enc=document.getElementById('encourage');
  let msg='🎉 ';
  if(pct>=90)msg+='太厲害了！幾乎全對！';
  else if(pct>=75)msg+='做得很好！再複習錯的就更棒了！';
  else if(pct>=60)msg+='不錯喔！把下面的重點多看幾次！';
  else msg+='沒關係，多練幾次一定會進步！';
  enc.textContent=msg;

  // 分類分析
  const bk=document.getElementById('breakdown');bk.innerHTML='<div class="section-title" style="margin-top:4px">各項表現</div>';
  const cats=Object.keys(state.perCat).sort((a,b)=>(state.perCat[a].right/state.perCat[a].total)-(state.perCat[b].right/state.perCat[b].total));
  cats.forEach(c=>{
    const d=state.perCat[c];const p=Math.round(d.right/d.total*100);
    const color=p>=80?'var(--green)':p>=50?'var(--gold)':'var(--red)';
    const row=document.createElement('div');row.className='brow';
    row.innerHTML=`<div class="bname">${catName(c)}</div>
      <div class="btrack"><div class="bfill" style="width:${p}%;background:${color}"></div></div>
      <div class="bpct">${d.right}/${d.total}</div>`;
    bk.appendChild(row);
  });

  // 錯題複習
  const wl=document.getElementById('wronglist');wl.innerHTML='';
  const rc=document.getElementById('reviewCard');
  if(state.wrong.length===0){
    rc.classList.add('hide');
  }else{
    rc.classList.remove('hide');
    state.wrong.forEach(w=>{
      const d=document.createElement('div');d.className='wrongitem';
      d.innerHTML=`<div class="wq">${w.q}</div>
        <div>✔ 正確答案：<span class="wa">${w.a}</span></div>
        ${w.exp?`<div style="color:var(--muted);margin-top:3px">💡 ${w.exp}</div>`:''}`;
      wl.appendChild(d);
    });
  }
  window.scrollTo(0,0);
}

document.getElementById('againBtn').onclick=()=>startQuiz();
document.getElementById('homeBtn').onclick=goHome;
function goHome(){
  document.getElementById('quiz').classList.add('hide');
  document.getElementById('result').classList.add('hide');
  document.getElementById('start').classList.remove('hide');
  window.scrollTo(0,0);
}

/* 初始化 */
renderPapers();
</script>
</body>
</html>
